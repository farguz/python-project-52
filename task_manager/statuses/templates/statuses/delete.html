{% extends "base.html" %}
{% load django_bootstrap5 %}
{% load i18n %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <h1>{% trans 'Delete status' %}</h1>
            <form action="{% url 'status_delete' status.id %}" method="post">
                {% csrf_token %}
                <p class="mb-3">
                    {% blocktrans with name=status.name %}
                        Are you sure you want to delete status {{ name }}?
                    {% endblocktrans %}
                </p>
                <button type="submit" class="btn btn-danger">{% trans 'Confirm deletion' %}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
